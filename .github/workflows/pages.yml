name: Deploy Xidian lab website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/imgs
          cp -a index.html people.html students.html publication.html news.html contact.html css js CNAME _site/
          for path in imgs/*; do
            if [[ "$path" != imgs/student-gallery ]]; then
              cp -a -- "$path" _site/imgs/
            fi
          done

      - name: Download and validate the latest published gallery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '
            .[] | select(
              (.tag_name | startswith("site-gallery-")) and (.draft | not)
              and (.assets | any(.name == "student-gallery.zip" and .state == "uploaded"))
            ) | "\(.published_at) \(.tag_name)"
          ' | sort | tail -n 1)"
          if [[ -n "$latest" ]]; then
            tag="${latest#* }"
            gh release download "$tag" --pattern 'student-gallery.zip' --dir "$RUNNER_TEMP"
            python3 tools/publish_student_gallery.py --extract "$RUNNER_TEMP/student-gallery.zip" _site/gallery "$tag"
          fi

      - uses: actions/upload-pages-artifact@v4
        id: artifact
        with:
          path: _site

      - name: Wait for the Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          for delay in 0 2 4 8 16; do
            sleep "$delay"
            if gh api --silent "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" 2>/dev/null; then
              exit 0
            fi
          done
          echo 'The uploaded Pages artifact did not become visible.' >&2
          exit 1

      - name: Deploy the uploaded artifact to GitHub Pages
        uses: actions/github-script@v8
        id: deployment
        timeout-minutes: 6
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          # Pass the known ID directly because deploy-pages did not list the uploaded artifact.
          script: |
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken(),
            });
            const failures = new Set([
              'deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost',
            ]);
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data: { status } } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                { ...context.repo, pages_deployment_id: deployment.id },
              );
              if (status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (failures.has(status)) throw new Error(`Pages deployment ended with ${status}.`);
            }
            throw new Error('Timed out waiting for the Pages deployment.');
